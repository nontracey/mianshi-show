# ============================================================================
# java-ai-service 应用配置(C 项目,与 B/D 同构)。
# 所有敏感/环境相关的值都用 ${ENV:default} 占位,便于按环境覆盖。
# ============================================================================

# Web 服务器(主体为 Spring MVC;Agent SSE 端点用 WebFlux,两者共存)
server:
  port: ${SERVER_PORT:8080}          # 服务端口
  servlet:
    encoding:
      charset: UTF-8                 # 中文内容,强制 UTF-8
      force: true

spring:
  application:
    name: java-ai-service

  ai:
    # Spring AI OpenAI 兼容接入(可指向通义/DeepSeek 等 OpenAI 兼容端点)
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}  # OpenAI 兼容 base url
      api-key: ${OPENAI_API_KEY:}                             # API Key(从环境变量注入,勿硬编码)
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}  # 对话模型
          temperature: 0                   # 温度 0:评估/生成都追求可复现
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}  # 向量化模型(维度需与向量库对齐)

    # Spring AI 1.1.x 通过 spring.ai.vectorstore.type 条件装配向量库。
    # 与 app.vector-store 共用 VECTOR_STORE，memory 模式不会创建 PgVectorStore，
    # pgvector 模式则自动装配真实 PgVectorStore 并要求 PostgreSQL 可用。
    vectorstore:
      type: ${VECTOR_STORE:memory}
      pgvector:
        dimensions: ${PGVECTOR_DIMENSIONS:512}  # 对齐本地 bge-small-zh-v1.5(512维);用 OpenAI embedding-3-small 时设 1536
        index-type: HNSW                        # HNSW 索引:查询快、召回高(百万级以下默认)
        distance-type: COSINE_DISTANCE          # 余弦距离
        initialize-schema: true                 # 首次启动自动建表
        table-name: vector_store
        max-document-batch-size: ${PGVECTOR_BATCH_SIZE:256}
        schema-name: public

  # pgvector 数据源(仅 app.vector-store=pgvector 时用)
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/ai_service}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}

# ----------------------------------------------------------------------------
# 自定义配置,绑定到 AppProperties(@ConfigurationProperties(prefix = "app"))
# ----------------------------------------------------------------------------
app:
  kb:
    # 知识库三层数据源,加载优先级:content-path > content-url > sample-path(见 Loader)
    content-url: ${KB_CONTENT_URL:https://raw.githubusercontent.com/nontracey/mianshi-zhilian-content/main/manifest.json}  # 远程 manifest
    content-path: ${KB_CONTENT_PATH:}                                                # 本地目录/manifest(第一优先)
    sample-path: ${KB_SAMPLE_PATH:../data/knowledge_base.sample.json}                # 内置样例(兜底)
  vector-store: ${VECTOR_STORE:memory}          # 向量库实现:memory(dev)/ pgvector(生产)
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:20}  # 每分钟限流阈值(预留配置)
  security:
    allow-anonymous: ${ALLOW_ANONYMOUS:true}
    api-keys: {}

management:
  # memory 演示不依赖 PostgreSQL/Redis，避免可选依赖让 Actuator 探针误报 DOWN。
  # 使用真实基础设施时显式设置 DB_HEALTH_ENABLED/REDIS_HEALTH_ENABLED=true。
  health:
    db:
      enabled: ${DB_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: mianshi-show-java

# Swagger / OpenAPI 文档
springdoc:
  swagger-ui:
    path: /docs          # Swagger UI 访问路径
  api-docs:
    path: /openapi.json  # OpenAPI JSON 路径

# 日志
logging:
  level:
    com.nontracey.aiservice: INFO
  pattern:
    # 日志格式:%X{traceId:-} 打印 TraceIdFilter 写入 MDC 的链路 ID,便于全链路排查
    console: "%d{HH:mm:ss} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
